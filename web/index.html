<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多文件资料上传向导的草稿关联 RPA</title><meta name="description" content="本地合成业务门户"><link rel="stylesheet" href="/style.css"></head><body><a href="#main">跳到操作区</a><main id="main"><h1>多文件资料上传向导的草稿关联 RPA</h1><p>本地合成资料，仅用于业务接入开发。</p><p id="status" class="status" role="status">页面加载中</p><label>所属项目<select id="project"><option value="PR-17">北区检测</option><option value="PR-29">南区检测</option></select></label><label>材料类型<select id="kind"><option value="report">检测报告</option><option value="license">许可材料</option></select></label><div id="fields"></div><input id="files" type="file" multiple><button id="back">返回上一步</button><button id="preview">草稿预览</button><button id="publish">最终发布</button><p id="draft"></p><section id="uploads"></section><pre id="preview-result"></pre><footer>数据与账号均为本地合成材料。</footer></main><script type="module" src="/app.js"></script></body></html>
